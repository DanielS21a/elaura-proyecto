<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel El Aura - Acceso Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 12px;
        }
        .btn-login {
            background-color: #0056d2;
            border-color: #0056d2;
            color: #ffffff;
        }
        .btn-login:hover,
        .btn-login:focus {
            background-color: #0046ad;
            border-color: #0046ad;
            color: #ffffff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card shadow-sm border-0 login-card p-4">
        <div class="card-body">
            <h1 class="h4 fw-bold text-center mb-2">Hotel El Aura - Acceso Personal</h1>
            <p class="text-muted text-center small mb-4">Ingrese sus credenciales para acceder al sistema</p>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small" role="alert">
                    Usuario o contraseña incorrectos. Por favor, inténtelo nuevamente.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold small">Usuario</label>
                    <input
                        type="text"
                        class="form-control"
                        id="id_username"
                        name="username"
                        placeholder="Ingrese su usuario"
                        required
                        autofocus
                    >
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold small">Contraseña</label>
                    <input
                        type="password"
                        class="form-control"
                        id="id_password"
                        name="password"
                        placeholder="••••••••"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-login w-100 fw-semibold py-2">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
